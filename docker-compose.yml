services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tdn
    ports:
      - '5432:5432'
    volumes:
      - tdn-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tdn']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tdn-db:
