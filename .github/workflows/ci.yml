name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, types, unit + database tests, boot smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tdn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tdn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tdn_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
      - name: Schema and migrations agree (no drift)
        # Fails if prisma/schema.prisma has changes that no migration creates.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Integration tests (real PostgreSQL - races, referrals, erasure, retention)
        run: npm run test:int

      - name: Configuration fails closed (placeholder secrets are refused in production)
        run: |
          if NODE_ENV=production PORT=3101 \
             JWT_SECRET='replace-with-a-long-random-string' \
             MPESA_CALLBACK_SECRET='replace-with-a-shared-secret' \
             CORS_ORIGIN=https://app.example.org APP_URL=https://app.example.org \
             node dist/src/main > refuse.log 2>&1; then
            echo "API started with placeholder secrets in production"; cat refuse.log; exit 1
          fi
          grep -q "Invalid configuration" refuse.log
          cat refuse.log

      - name: Boot the production build and smoke-test it end to end
        run: |
          export NODE_ENV=production PORT=3100
          export JWT_SECRET="$(openssl rand -hex 32)" MPESA_CALLBACK_SECRET="$(openssl rand -hex 16)"
          export CORS_ORIGIN=https://app.example.org APP_URL=https://app.example.org
          node dist/src/main > api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fs http://localhost:3100/api/health >/dev/null 2>&1 && break
            kill -0 $API_PID 2>/dev/null || { echo "API exited early"; cat api.log; exit 1; }
            sleep 1
          done
          EXPECT_SECURE=1 ../scripts/smoke-api.sh http://localhost:3100 || { echo "--- api.log ---"; cat api.log; exit 1; }
          # Swagger is off by default in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/docs)" = 404
          # Logs are structured JSON and carry no cookies or tokens.
          grep -q '"req":{"id"' api.log
          if grep -Eiq 'tdn_session|authorization|set-cookie' api.log; then
            echo "Credentials found in logs"; exit 1
          fi

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build # runs tsc --noEmit, then vite build

  # ---------------------------------------------------------------------------
  repo-checks:
    name: Scripts, privacy-notice version, compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          bash -n scripts/*.sh ops/*.sh
          shellcheck scripts/*.sh ops/*.sh
      - name: Privacy notice version matches in API and web
        run: scripts/check-policy-version.sh
      - name: Compose files are valid
        env:
          JWT_SECRET: ci
          MPESA_CALLBACK_SECRET: ci
          ADMIN_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.full.yml config --quiet

  # ---------------------------------------------------------------------------
  security:
    name: Security (dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (fail on critical, report high)
        run: |
          status=0
          for app in backend frontend; do
            echo "::group::$app"
            (cd $app && npm ci --ignore-scripts --omit=dev >/dev/null 2>&1)
            (cd $app && npm audit --omit=dev --audit-level=critical) || status=1
            (cd $app && npm audit --omit=dev --audit-level=high) || echo "::warning::$app has high-severity advisories (see docs/operations/runbook.md, known risks)"
            echo "::endgroup::"
          done
          exit $status
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  docker:
    name: Docker (build images, run the full stack, smoke-test through nginx)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      MPESA_CALLBACK_SECRET: ci-only-mpesa-secret-0123456789
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db + api + web
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml up --build -d
      - name: Wait for the web app to answer
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/api/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Stack did not become ready"; exit 1
      - name: Smoke test through nginx (same path a browser uses)
        run: scripts/smoke-api.sh http://localhost:8080
      - name: The web app and privacy notice are served
        run: |
          curl -fs http://localhost:8080/ | grep -qi '<div id="root"'
          curl -fs http://localhost:8080/privacy | grep -qi '<div id="root"'
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml down -v
